<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Panel Profesional - Mi Catálogo</title>
    <style>
        /* ============================================================
           ESTILOS PROFESIONALES - Todo en un solo archivo
           ============================================================ */
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --secondary: #0d47a1;
            --accent: #ff6f00;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #f57c00;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #666;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        /* ========== HEADER ========== */
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px 30px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.3);
        }

        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
        }

        .app-header .logo img {
            height: 40px;
            width: auto;
        }

        .app-header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .app-header .user-info .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ========== CONTENEDOR ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ========== ESTADÍSTICAS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .label {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 5px;
        }

        /* ========== BOTONES DE ACCIÓN ========== */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

        .btn-publish {
            background: linear-gradient(135deg, var(--success), #1b5e20);
            color: white;
            padding: 14px 32px;
            font-size: 17px;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(46, 125, 50, 0); }
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ========== FORMULARIO ========== */
        .form-panel {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-panel h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: var(--danger);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
            background: white;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .form-group .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .form-group .file-input-wrapper .file-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: var(--text-light);
        }

        .form-group .file-input-wrapper .file-label:hover {
            border-color: var(--primary);
            background: #f0f2ff;
        }

        .form-group .image-preview {
            margin-top: 10px;
            max-width: 200px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .form-group .image-preview img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            grid-column: 1 / -1;
        }

        /* ========== CHECKBOX DESTACADO ========== */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 15px;
            cursor: pointer;
        }

        /* ========== LISTA DE PRODUCTOS ========== */
        .product-list {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .product-list-header {
            display: grid;
            grid-template-columns: 60px 1fr 120px 120px 100px;
            padding: 14px 20px;
            background: #f8f9fc;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
            border-bottom: 1px solid #eee;
        }

        .product-item {
            display: grid;
            grid-template-columns: 60px 1fr 120px 120px 100px;
            padding: 14px 20px;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .product-item:hover {
            background: #f8f9fc;
        }

        .product-item .product-img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-item .product-name {
            font-weight: 600;
            font-size: 15px;
        }

        .product-item .product-name .badge-featured {
            background: var(--accent);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .product-item .product-category {
            font-size: 13px;
            color: var(--text-light);
        }

        .product-item .product-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
        }

        .product-item .product-actions {
            display: flex;
            gap: 6px;
        }

        .product-item .product-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .product-item .product-actions .btn-edit {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .product-item .product-actions .btn-edit:hover {
            background: #bbdefb;
        }

        .product-item .product-actions .btn-delete {
            background: #ffebee;
            color: var(--danger);
        }

        .product-item .product-actions .btn-delete:hover {
            background: #ffcdd2;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-light);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* ========== TOAST / MENSAJES ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            display: none;
            max-width: 400px;
            animation: slideIn 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        .toast.warning { background: var(--warning); }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ========== LOADER ========== */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 16px 20px;
            }

            .app-header .user-info {
                justify-content: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .product-list-header {
                display: none;
            }

            .product-item {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 16px 20px;
                text-align: center;
            }

            .product-item .product-img {
                margin: 0 auto;
            }

            .product-item .product-actions {
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .action-bar {
                justify-content: center;
            }

            .toast {
                left: 20px;
                right: 20px;
                bottom: 20px;
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* ========== SCROLLBAR PERSONALIZADA ========== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== HEADER ========== -->
        <header class="app-header">
            <div class="logo">
                <!-- Cambia esto por tu logo: <img src="tu-logo.png" alt="Logo" style="height:40px;" /> -->
                <span>📋 MiCatálogo</span>
            </div>
            <div class="user-info">
                <span>👤 <span id="userName">Usuario</span></span>
                <span class="badge" id="catalogoBadge">Catálogo</span>
                <button class="btn-logout" onclick="cerrarSesion()">🚪 Salir</button>
            </div>
        </header>

        <!-- ========== ESTADÍSTICAS ========== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalProducts">0</div>
                <div class="label">📦 Total Productos</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalCategories">0</div>
                <div class="label">📂 Categorías</div>
            </div>
            <div class="stat-card">
                <div class="number" id="featuredProducts">0</div>
                <div class="label">⭐ Destacados</div>
            </div>
            <div class="stat-card">
                <div class="number" id="changesCount">0</div>
                <div class="label">🔄 Cambios pendientes</div>
            </div>
        </div>

        <!-- ========== BARRA DE ACCIONES ========== -->
        <div class="action-bar">
            <button class="btn btn-primary" onclick="mostrarFormulario()">➕ Agregar Producto</button>
            <button class="btn btn-success btn-publish" onclick="publicarCambios()" id="publishBtn">
                🚀 PUBLICAR CAMBIOS
            </button>
            <button class="btn btn-outline" onclick="recargarProductos()">🔄 Recargar</button>
            <button class="btn btn-outline" onclick="verCatalogoPublico()">👁️ Ver Catálogo</button>
        </div>

        <!-- ========== FORMULARIO ========== -->
        <div class="form-panel" id="formPanel">
            <h2 id="formTitle">➕ Agregar Nuevo Producto</h2>
            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre <span class="required">*</span></label>
                        <input type="text" id="nombre" placeholder="Ej: Laptop Gamer Pro" required />
                    </div>
                    <div class="form-group">
                        <label>Precio <span class="required">*</span></label>
                        <input type="number" id="precio" step="0.01" placeholder="0.00" required />
                    </div>
                    <div class="form-group">
                        <label>Categoría <span class="required">*</span></label>
                        <input type="text" id="categoria" placeholder="Ej: Electrónicos" required />
                    </div>
                    <div class="form-group">
                        <label>Imagen</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="imagenFile" accept="image/*" onchange="previewImage(this)" />
                            <div class="file-label">
                                📁 Seleccionar imagen desde tu dispositivo
                            </div>
                        </div>
                        <div class="image-preview" id="imagePreview">
                            <img id="previewImg" src="#" alt="Vista previa" />
                        </div>
                        <input type="hidden" id="imagenUrl" value="" />
                        <div style="font-size: 12px; color: #999; margin-top: 6px;">
                            También puedes pegar una URL: <input type="text" id="imagenUrlInput" placeholder="https://..." style="display: inline; width: auto; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px;" onchange="document.getElementById('imagenUrl').value=this.value" />
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label>Descripción</label>
                        <textarea id="descripcion" placeholder="Describe tu producto..."></textarea>
                    </div>
                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <input type="checkbox" id="destacado" />
                            <label for="destacado">⭐ Destacar este producto (aparecerá con insignia especial)</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">💾 Guardar Producto</button>
                        <button type="button" class="btn btn-danger" onclick="cerrarFormulario()">❌ Cancelar</button>
                    </div>
                </div>
                <input type="hidden" id="editId" value="" />
            </form>
        </div>

        <!-- ========== LISTA DE PRODUCTOS ========== -->
        <div class="product-list">
            <div class="product-list-header">
                <span>Imagen</span>
                <span>Producto</span>
                <span>Categoría</span>
                <span>Precio</span>
                <span>Acciones</span>
            </div>
            <div id="productListContainer">
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>Cargando productos...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== TOAST ========== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================
    JAVASCRIPT - Toda la lógica del panel
    ================================================================ -->
    <script>
        // ============================================================
        // CONFIGURACIÓN - ¡SOLO CAMBIA ESTO!
        // ============================================================
        // IMPORTANTE: Pon aquí tu token de GitHub
        const GITHUB_TOKEN = 'PENDIENTE'; // <--- CAMBIA ESTO por tu token

        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let productos = [];
        let productosOriginales = [];
        let catalogoActual = null;
        let modoEdicion = false;
        let cambiosPendientes = false;

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        (async function init() {
            // Verificar sesión
            const auth = localStorage.getItem('admin_auth');
            const catalogoId = localStorage.getItem('catalogo_actual');

            if (auth !== 'true' || !catalogoId) {
                window.location.href = 'admin.html';
                return;
            }

            // Cargar configuración
            try {
                const response = await fetch('config.json');
                const data = await response.json();
                catalogoActual = data.catalogos.find(c => c.id === catalogoId);

                if (!catalogoActual) {
                    throw new Error('Catálogo no encontrado');
                }

                // Mostrar información del usuario
                document.getElementById('userName').textContent = catalogoActual.nombre;
                document.getElementById('catalogoBadge').textContent = catalogoActual.id;

                // Cargar productos
                await cargarProductos();

            } catch (error) {
                console.error('Error al iniciar:', error);
                mostrarToast('❌ Error al cargar la configuración: ' + error.message, 'error');
            }
        })();

        // ============================================================
        // FUNCIONES PRINCIPALES
        // ============================================================

        // Cargar productos desde el repositorio
        async function cargarProductos() {
            try {
                const url = `https://raw.githubusercontent.com/negociosencuba/${catalogoActual.repo}/main/productos.json`;
                const response = await fetch(url);
                const data = await response.json();
                productos = data.productos || [];
                productosOriginales = JSON.parse(JSON.stringify(productos));
                cambiosPendientes = false;

                actualizarEstadisticas();
                renderizarProductos();
                actualizarBotonPublicar();

                mostrarToast('✅ Productos cargados correctamente', 'success');
            } catch (error) {
                console.error('Error cargando productos:', error);
                // Si no hay archivo, empezar con lista vacía
                if (error.status === 404) {
                    productos = [];
                    productosOriginales = [];
                    cambiosPendientes = false;
                    actualizarEstadisticas();
                    renderizarProductos();
                    actualizarBotonPublicar();
                    mostrarToast('📭 No hay productos aún. ¡Agrega tu primero!', 'info');
                } else {
                    mostrarToast('❌ Error al cargar productos: ' + error.message, 'error');
                }
            }
        }

        // Renderizar lista de productos
        function renderizarProductos() {
            const container = document.getElementById('productListContainer');

            if (productos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p><strong>No hay productos en tu catálogo</strong></p>
                        <p style="font-size: 14px; margin-top: 8px;">Haz clic en "Agregar Producto" para comenzar</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = productos.map((p, index) => `
                <div class="product-item" data-index="${index}">
                    <img src="${p.imagen || 'https://via.placeholder.com/45x45?text=Sin+Imagen'}" 
                         alt="${p.nombre}" 
                         class="product-img"
                         onerror="this.src='https://via.placeholder.com/45x45?text=No+Image'" />
                    <div class="product-name">
                        ${p.nombre}
                        ${p.destacado ? '<span class="badge-featured">⭐ Destacado</span>' : ''}
                    </div>
                    <div class="product-category">${p.categoria || 'Sin categoría'}</div>
                    <div class="product-price">$${p.precio ? p.precio.toFixed(2) : '0.00'}</div>
                    <div class="product-actions">
                        <button class="btn-edit" onclick="editarProducto(${index})">✏️</button>
                        <button class="btn-delete" onclick="eliminarProducto(${index})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // Actualizar estadísticas
        function actualizarEstadisticas() {
            document.getElementById('totalProducts').textContent = productos.length;

            const categorias = new Set(productos.map(p => p.categoria));
            document.getElementById('totalCategories').textContent = categorias.size;

            const destacados = productos.filter(p => p.destacado).length;
            document.getElementById('featuredProducts').textContent = destacados;

            const cambios = productos.length !== productosOriginales.length ||
                JSON.stringify(productos) !== JSON.stringify(productosOriginales);
            cambiosPendientes = cambios;
            document.getElementById('changesCount').textContent = cambios ? '⚠️ Sí' : '✅ Sin cambios';
        }

        // Actualizar botón de publicar
        function actualizarBotonPublicar() {
            const btn = document.getElementById('publishBtn');
            if (cambiosPendientes) {
                btn.innerHTML = '🚀 PUBLICAR CAMBIOS (⚠️ Pendiente)';
                btn.style.background = 'linear-gradient(135deg, #f57c00, #e65100)';
            } else {
                btn.innerHTML = '✅ PUBLICAR CAMBIOS';
                btn.style.background = 'linear-gradient(135deg, var(--success), #1b5e20)';
            }
        }

        // ============================================================
        // FORMULARIO
        // ============================================================

        function mostrarFormulario(producto = null) {
            const panel = document.getElementById('formPanel');
            panel.classList.add('active');

            if (producto) {
                // Modo edición
                document.getElementById('formTitle').textContent = '✏️ Editar Producto';
                document.getElementById('submitBtn').textContent = '💾 Actualizar Producto';
                document.getElementById('editId').value = producto.id || '';
                document.getElementById('nombre').value = producto.nombre || '';
                document.getElementById('precio').value = producto.precio || '';
                document.getElementById('categoria').value = producto.categoria || '';
                document.getElementById('descripcion').value = producto.descripcion || '';
                document.getElementById('imagenUrl').value = producto.imagen || '';
                document.getElementById('imagenUrlInput').value = producto.imagen || '';
                document.getElementById('destacado').checked = producto.destacado || false;
                modoEdicion = true;

                // Mostrar preview de imagen
                if (producto.imagen) {
                    const preview = document.getElementById('imagePreview');
                    preview.style.display = 'block';
                    document.getElementById('previewImg').src = producto.imagen;
                }
            } else {
                // Modo nuevo
                document.getElementById('formTitle').textContent = '➕ Agregar Nuevo Producto';
                document.getElementById('submitBtn').textContent = '💾 Guardar Producto';
                document.getElementById('productForm').reset();
                document.getElementById('editId').value = '';
                document.getElementById('imagenUrl').value = '';
                document.getElementById('imagenUrlInput').value = '';
                document.getElementById('imagePreview').style.display = 'none';
                modoEdicion = false;
            }

            // Scroll al formulario
            panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cerrarFormulario() {
            document.getElementById('formPanel').classList.remove('active');
        }

        // ============================================================
        // PREVISUALIZACIÓN DE IMAGEN
        // ============================================================

        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            const img = document.getElementById('previewImg');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    preview.style.display = 'block';
                    // Guardar la URL para subirla después
                    document.getElementById('imagenUrl').value = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // ============================================================
        // GUARDAR PRODUCTO
        // ============================================================

        document.getElementById('productForm').onsubmit = function(e) {
            e.preventDefault();

            const producto = {
                nombre: document.getElementById('nombre').value.trim(),
                precio: parseFloat(document.getElementById('precio').value) || 0,
                categoria: document.getElementById('categoria').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim(),
                imagen: document.getElementById('imagenUrl').value || 'https://via.placeholder.com/300x200?text=Sin+Imagen',
                destacado: document.getElementById('destacado').checked
            };

            // Validar campos obligatorios
            if (!producto.nombre || !producto.categoria) {
                mostrarToast('⚠️ Nombre y categoría son obligatorios', 'warning');
                return;
            }

            const editId = document.getElementById('editId').value;

            if (editId) {
                // Editar producto existente
                const index = productos.findIndex(p => p.id === parseInt(editId));
                if (index !== -1) {
                    producto.id = parseInt(editId);
                    productos[index] = producto;
                }
                mostrarToast('✅ Producto actualizado correctamente', 'success');
            } else {
                // Nuevo producto
                const nuevoId = productos.length > 0 ? Math.max(...productos.map(p => p.id)) + 1 : 1;
                producto.id = nuevoId;
                productos.push(producto);
                mostrarToast('✅ Producto agregado correctamente', 'success');
            }

            actualizarEstadisticas();
            renderizarProductos();
            actualizarBotonPublicar();
            cerrarFormulario();
        };

        // ============================================================
        // EDITAR PRODUCTO
        // ============================================================

        function editarProducto(index) {
            const producto = productos[index];
            if (!producto) return;
            mostrarFormulario(producto);
        }

        // ============================================================
        // ELIMINAR PRODUCTO
        // ============================================================

        function eliminarProducto(index) {
            const producto = productos[index];
            if (!producto) return;

            if (confirm(`¿Eliminar el producto "${producto.nombre}"?`)) {
                productos.splice(index, 1);
                actualizarEstadisticas();
                renderizarProductos();
                actualizarBotonPublicar();
                mostrarToast('🗑️ Producto eliminado', 'success');
            }
        }

        // ============================================================
        // PUBLICAR CAMBIOS A GITHUB
        // ============================================================

        async function publicarCambios() {
            if (!cambiosPendientes) {
                mostrarToast('✅ No hay cambios pendientes para publicar', 'info');
                return;
            }

            // Verificar que hay token
            if (GITHUB_TOKEN === 'PENDIENTE') {
                mostrarToast('⚠️ Configura el token de GitHub en la variable GITHUB_TOKEN del código', 'warning');
                return;
            }

            const btn = document.getElementById('publishBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Publicando...';
            btn.disabled = true;

            try {
                // Preparar datos
                const data = { productos: productos };
                const content = JSON.stringify(data, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(content)));

                // Obtener el SHA del archivo actual (para reemplazarlo)
                let sha = null;
                try {
                    const fileResponse = await fetch(
                        `https://api.github.com/repos/negociosencuba/${catalogoActual.repo}/contents/productos.json`,
                        {
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );
                    if (fileResponse.ok) {
                        const fileData = await fileResponse.json();
                        sha = fileData.sha;
                    }
                } catch (e) {
                    // El archivo no existe, se creará nuevo
                    console.log('Archivo no existe, se creará nuevo');
                }

                // Subir el archivo
                const payload = {
                    message: `Actualizar productos - ${new Date().toLocaleString()}`,
                    content: encodedContent,
                    branch: 'main'
                };
                if (sha) {
                    payload.sha = sha;
                }

                const response = await fetch(
                    `https://api.github.com/repos/negociosencuba/${catalogoActual.repo}/contents/productos.json`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify(payload)
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Error al publicar');
                }

                // Éxito
                productosOriginales = JSON.parse(JSON.stringify(productos));
                cambiosPendientes = false;
                actualizarEstadisticas();
                actualizarBotonPublicar();

                mostrarToast('🎉 ¡Catálogo actualizado! La web se actualizará en 1-2 minutos', 'success');

                // Verificar que se actualizó
                setTimeout(() => {
                    if (confirm('¿Ver el catálogo público actualizado?')) {
                        verCatalogoPublico();
                    }
                }, 3000);

            } catch (error) {
                console.error('Error al publicar:', error);
                mostrarToast('❌ Error al publicar: ' + error.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ============================================================
        // UTILIDADES
        // ============================================================

        function recargarProductos() {
            cargarProductos();
            mostrarToast('🔄 Recargando productos...', 'info');
        }

        function verCatalogoPublico() {
            if (catalogoActual && catalogoActual.url) {
                window.open(catalogoActual.url, '_blank');
            } else {
                mostrarToast('⚠️ No hay URL configurada para este catálogo', 'warning');
            }
        }

        function cerrarSesion() {
            if (cambiosPendientes) {
                if (!confirm('⚠️ Tienes cambios sin publicar. ¿Seguro que quieres salir?')) {
                    return;
                }
            }
            localStorage.removeItem('admin_auth');
            localStorage.removeItem('catalogo_actual');
            window.location.href = 'admin.html';
        }

        // ============================================================
        // TOAST - MENSAJES
        // ============================================================

        function mostrarToast(mensaje, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast ${tipo} show`;

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        // SOPORTE PARA TECLADO (Enter en el formulario)
        // ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarFormulario();
            }
        });
    </script>
</body>
</html>
