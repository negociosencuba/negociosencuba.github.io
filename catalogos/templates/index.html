<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Catálogo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>🏷️ Mi Catálogo</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar productos..." />
            <select id="categoryFilter">
                <option value="all">Todas las categorías</option>
            </select>
        </div>
    </header>

    <main id="productContainer" class="product-grid">
        <div class="loading">Cargando productos...</div>
    </main>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let productos = [];
        let productosFiltrados = [];

        // ========== CARGAR PRODUCTOS ==========
        async function cargarProductos() {
            try {
                const response = await fetch('productos.json');
                const data = await response.json();
                productos = data.productos || [];
                productosFiltrados = productos;
                
                cargarCategorias();
                renderizarProductos();
            } catch (error) {
                console.error('Error cargando productos:', error);
                document.getElementById('productContainer').innerHTML = `
                    <div class="error">
                        ❌ Error al cargar productos. Por favor, recarga la página.
                    </div>
                `;
            }
        }

        // ========== CARGAR CATEGORÍAS ==========
        function cargarCategorias() {
            const categorias = [...new Set(productos.map(p => p.categoria))];
            const filter = document.getElementById('categoryFilter');
            
            categorias.forEach(categoria => {
                const option = document.createElement('option');
                option.value = categoria;
                option.textContent = categoria;
                filter.appendChild(option);
            });
        }

        // ========== RENDERIZAR PRODUCTOS ==========
        function renderizarProductos() {
            const container = document.getElementById('productContainer');
            
            if (productosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        😕 No se encontraron productos
                    </div>
                `;
                return;
            }

            container.innerHTML = productosFiltrados.map(producto => `
                <div class="product-card">
                    <div class="product-image">
                        <img 
                            src="${producto.imagen || 'https://via.placeholder.com/300x200?text=Sin+Imagen'}" 
                            alt="${producto.nombre}"
                            loading="lazy"
                            onerror="this.src='https://via.placeholder.com/300x200?text=Sin+Imagen'"
                        />
                        ${producto.destacado ? '<span class="badge">⭐ Destacado</span>' : ''}
                    </div>
                    <div class="product-info">
                        <h3>${producto.nombre}</h3>
                        <p class="category">${producto.categoria}</p>
                        <p class="description">${producto.descripcion || ''}</p>
                        <div class="product-footer">
                            <span class="price">$${producto.precio ? producto.precio.toFixed(2) : '0.00'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ========== FILTRAR PRODUCTOS ==========
        function filtrarProductos() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            
            productosFiltrados = productos.filter(producto => {
                const matchSearch = producto.nombre.toLowerCase().includes(searchTerm) ||
                                   (producto.descripcion && producto.descripcion.toLowerCase().includes(searchTerm));
                const matchCategory = category === 'all' || producto.categoria === category;
                return matchSearch && matchCategory;
            });
            
            renderizarProductos();
        }

        // ========== EVENTOS ==========
        document.getElementById('searchInput').addEventListener('input', filtrarProductos);
        document.getElementById('categoryFilter').addEventListener('change', filtrarProductos);

        // ========== INICIALIZAR ==========
        document.addEventListener('DOMContentLoaded', cargarProductos);
    </script>
</body>
</html>
