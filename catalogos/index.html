<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogos Disponibles</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>📚 Catálogos Disponibles</h1>
        <p>Selecciona un catálogo para ver los productos:</p>

        <div id="catalogoList" class="catalogo-grid">
            <div class="loading">Cargando catálogos...</div>
        </div>
    </div>

    <script>
        // ========== CARGAR CATÁLOGOS ==========
        async function cargarCatalogos() {
            try {
                const response = await fetch('config.json');
                const data = await response.json();
                const catalogos = data.catalogos;

                const list = document.getElementById('catalogoList');

                if (catalogos.length === 0) {
                    list.innerHTML = '<p>No hay catálogos disponibles.</p>';
                    return;
                }

                list.innerHTML = catalogos.map(c => `
                    <div class="catalogo-card">
                        <h3>${c.nombre}</h3>
                        <p>${c.usuario}</p>
                        <a href="${c.url}" target="_blank" class="btn-primary">Ver catálogo</a>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error cargando catálogos:', error);
                document.getElementById('catalogoList').innerHTML = `
                    <div class="error">❌ Error cargando los catálogos.</div>
                `;
            }
        }

        // ========== INICIALIZAR ==========
        document.addEventListener('DOMContentLoaded', cargarCatalogos);
    </script>
</body>
</html>
